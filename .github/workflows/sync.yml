name: Sync LeetCode data

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync compensation + interviews
        env:
          PYTHONPATH: src
        run: |
          python -m salarytracker.cli --max-posts 500
          python -m salarytracker.cli interview-sync --max-posts 400

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json public/data/*.json || true
          git diff --staged --quiet || git commit -m "chore: sync dashboard data"
          git push
