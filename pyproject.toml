[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "salarytracker"
version = "0.1.0"
description = "India software engineer salary dashboard from LeetCode compensation posts"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "openai>=1.0.0",
]

[project.scripts]
salary-sync = "salarytracker.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/salarytracker"]
